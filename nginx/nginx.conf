resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_read_timeout 30s;
        error_page 502 503 504 = @api_unavailable;
        include /etc/nginx/security-headers.conf;
    }

    # Same error envelope as the backend, so the SPA can show a friendly message while the API is down.
    location @api_unavailable {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        return 503 '{"error":{"code":"service_unavailable","message":"The API is not reachable.","details":null}}';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
